[project]
name = "smart-space-master"
version = "0.1.0"
description = "Smart space master controller dashboard backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "gpiozero>=2.0.1",
  "google-genai>=1.0.0",
  "paho-mqtt>=2.1.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_space"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
